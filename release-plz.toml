[workspace]
release = true
# semver_check defaults to true for libraries, but fulgur-wasm/pyfulgur/fulgur-ruby
# are bindings that aren't published to crates.io and have no registry baseline to
# diff against — leave it off workspace-wide and opt in only where it's meaningful.
semver_check = false
# ZeroVer policy: never auto-bump patch, only minor. Matching everything here
# means every triggering commit (conventional or not) resolves to Minor instead
# of falling through to release-plz's default Patch case (see next_version's
# is_minor_bump()/is_major_bump()); major stays pinned at 0 since
# breaking_always_increment_major is left at its false default.
custom_minor_increment_regex = ".*"
# `no_increment_regex` (used here previously, added in PR #533) does not exist
# in release-plz's actual release-plz.toml schema (verified against
# `release-plz generate-schema` on release-plz 0.3.159, the latest published
# version as of this writing -- it's only a next_version crate Rust API,
# never wired through release_plz_core's TOML config). Any release-plz
# invocation against that key fails immediately with
# `unknown field `no_increment_regex``, so main's release-plz.toml has been
# unusable since PR #533 merged.
#
# There's no config-only fix that also skips releases outright for
# chore/docs/style/test/build/ci-only commits: the schema-real equivalent,
# `release_commits`, gates whether get_next_version() even runs for a
# package -- and packages with no `release_commits`-matching commit of their
# own fall through to a separate "dependency changed" code path that bumps a
# bare patch and bypasses version_group's lockstep-max propagation entirely
# (verified empirically: with release_commits set, fulgur-cli alone ended up
# at 0.20.1 while fulgur/fulgur-ruby/fulgur-wasm/pyfulgur went to 0.21.0).
# Preserving the 5-crate "core" version_group lockstep matters more than
# skipping releases for trivial-only commits, so that requirement is dropped
# instead: every push that changes anything still bumps minor across the
# whole group, even chore/docs/ci-only ones. That's a reversion to the
# original ZeroVer "every release bumps minor" philosophy, not a regression.
# Default tag/release naming is per-package ("{{ package }}-v{{ version }}") once a
# workspace has more than one publishable crate (fulgur + fulgur-cli here), which
# would produce multiple tags/releases instead of the single v$VERSION tag the
# current pipeline and this epic's design rely on. Disable by default, then opt a
# single package back in below as the canonical release tag/name.
git_tag_enable = false
git_release_enable = false

# Changelog is PR-based, not commit-based. The root CHANGELOG.md and each GitHub
# Release body are rendered from merged PRs (classified by release-notes:* labels
# in .github/release.yml) — the root file is prepended in release-plz.yml's
# release-pr aux-sync step, the Release body is set in release.yml's release job.
# Disable release-plz's own commit-based per-crate changelog generation entirely
# so the two don't compete and no crates/*/CHANGELOG.md is (re)created.
# See fulgur-b0nb.
changelog_update = false

[[package]]
name = "fulgur"
version_group = "core"
publish = true
semver_check = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
# Keep the release-plz.yml `release` job's GH Release as draft until
# release.yml's build-binaries/release jobs attach platform binaries and
# flip it to non-draft — preserves the existing release-prepare.yml /
# release.yml ordering (binaries before the release is publicly visible).
git_release_draft = true

[[package]]
name = "fulgur-cli"
version_group = "core"
publish = true

# Backend-independent core and the Blitz backend, re-exported by the `fulgur`
# facade. Published in lockstep with it (fulgur-hgro).
[[package]]
name = "fulgur-core"
version_group = "core"
publish = true

[[package]]
name = "fulgur-blitz"
version_group = "core"
publish = true

# git_only: without this, release-plz checks crates.io for these publish=false
# crates, finds nothing, and they silently drop out of the "core" version_group
# lockstep (only fulgur/fulgur-cli would get bumped). See fulgur-7b3l notes.
[[package]]
name = "fulgur-wasm"
version_group = "core"
publish = false
git_only = true

[[package]]
name = "pyfulgur"
version_group = "core"
publish = false
git_only = true

[[package]]
name = "fulgur-ruby"
version_group = "core"
publish = false
git_only = true

# release = false fully excludes these test/fixture crates (version 0.0.0) from
# release-plz entirely — different from publish = false above, which still
# version-tracks the binding crates via the core version_group.
# publish = false is still required alongside release = false: `release-plz
# release` validates that each package's configured publish flag matches its
# Cargo.toml (which has publish = false here), and errors before the release =
# false exclusion is applied otherwise. (release-pr/update skip this check, so
# the mismatch only surfaced once release-plz.yml first ran `release-plz
# release`.)
[[package]]
name = "fulgur-vrt"
release = false
publish = false

[[package]]
name = "fulgur-wpt"
release = false
publish = false
