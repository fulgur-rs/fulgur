name: Raikiri

# The unpublished Raikiri backend (crates/fulgur-raikiri + crates/fulgur-dev)
# is checked here instead of in ci.yml, so:
#   - a Raikiri-side failure never blocks Blitz PRs (this workflow is not a
#     required check), and
#   - the five-cell `test` matrix in ci.yml no longer compiles Raikiri.
# PRs run it only when they touch the Raikiri backend, its direct
# dependencies, or the Raikiri pin (Cargo.lock). The nightly schedule catches
# breakage that slips in from elsewhere (e.g. a fulgur-blitz API change that
# fulgur-dev consumes). The nightly schedule (and manual dispatch) also runs
# the WPT reftests through the Raikiri backend (the `wpt` job) and compares
# the fulgur-vrt fixtures against the Blitz goldens (the `vrt` job).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/raikiri.yml"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "codecov.yml"
      - "crates/fulgur-core/**"
      - "crates/fulgur-raikiri/**"
      - "crates/fulgur-dev/**"
      - "crates/fulgur-wpt/**"
      # Only the files that can break the fulgur-vrt `raikiri` feature build;
      # Blitz golden and fixture updates do not need this workflow.
      - "crates/fulgur-vrt/Cargo.toml"
      - "crates/fulgur-vrt/src/**"
      - "crates/fulgur-vrt/tests/**"
      - "scripts/compare-raikiri-dev.py"
      - "scripts/compare_raikiri_dev_tests.py"
      # Test inputs fulgur-dev / fulgur-raikiri read from outside their crates.
      - "tests/fixtures/raikiri-dev/**"
      - "crates/fulgur-ruby/spec/fixtures/**"
      - "crates/fulgur-blitz/tests/fixtures/fonts/**"
  pull_request:
    paths:
      - ".github/workflows/raikiri.yml"
      - ".config/nextest.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "codecov.yml"
      - "crates/fulgur-core/**"
      - "crates/fulgur-raikiri/**"
      - "crates/fulgur-dev/**"
      - "crates/fulgur-wpt/**"
      # Only the files that can break the fulgur-vrt `raikiri` feature build;
      # Blitz golden and fixture updates do not need this workflow.
      - "crates/fulgur-vrt/Cargo.toml"
      - "crates/fulgur-vrt/src/**"
      - "crates/fulgur-vrt/tests/**"
      - "scripts/compare-raikiri-dev.py"
      - "scripts/compare_raikiri_dev_tests.py"
      # Test inputs fulgur-dev / fulgur-raikiri read from outside their crates.
      - "tests/fixtures/raikiri-dev/**"
      - "crates/fulgur-ruby/spec/fixtures/**"
      - "crates/fulgur-blitz/tests/fixtures/fonts/**"
  schedule:
    # 02:30 UTC daily (11:30 JST), after WPT nightly starts.
    - cron: '30 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stacked pull requests: GitHub runs this workflow for every PR in a stack
# as if it targeted the stack base, so one push in the middle of a stack
# re-runs every PR above it. Jobs carrying the `stack` condition below run
# only for PRs outside a stack, for the lowest unmerged PR (the one that
# targets the stack base directly), and for the top PR (which carries the
# whole stack's changes). Middle PRs skip this workflow's only job; ci.yml
# still runs its cheap checks there. `stack` is null on push/schedule events and for PRs outside a stack, so those always run
# everything. See
# https://docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/optimizing-ci-for-stacked-pull-requests
jobs:
  raikiri:
    if: github.event.pull_request.stack == null || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref || github.event.pull_request.stack.position == github.event.pull_request.stack.size
    name: raikiri backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur-raikiri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install poppler-utils (for fulgur-dev raster tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - name: Configure mold linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # nextest
      - name: Test development backend comparison script
        run: python3 -m unittest discover -s scripts -p compare_raikiri_dev_tests.py
      - name: Rustfmt
        run: cargo fmt --check -p fulgur-raikiri -p fulgur-dev -p fulgur-wpt -p fulgur-vrt
      - name: Clippy
        run: cargo clippy -p fulgur-raikiri -p fulgur-dev -p fulgur-wpt -p fulgur-vrt --features fulgur-wpt/raikiri,fulgur-vrt/raikiri --all-targets -- -D warnings
      # Run the tests under coverage so Codecov patch coverage keeps working
      # on Raikiri PRs now that ci.yml excludes these crates. The upload is
      # flagged `raikiri` and carried forward (codecov.yml) on commits where
      # this workflow does not run.
      - name: Run tests with coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest -p fulgur-raikiri -p fulgur-dev -p fulgur-wpt --features fulgur-wpt/raikiri --profile ci --no-report
          # fulgur-vrt unit tests only: vrt_test needs the pinned font set,
          # and ci.yml does not collect coverage for fulgur-vrt.
          cargo llvm-cov nextest -p fulgur-vrt --features fulgur-vrt/raikiri --lib --profile ci --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          flags: raikiri
          use_oidc: true
          fail_ci_if_error: false

  # WPT reftests rendered through the Raikiri backend (fulgur-raikiri's
  # Krilla painter), compared against the Raikiri expectations under
  # crates/fulgur-wpt/expectations/raikiri/. The step summary also lists
  # where the results differ from the Blitz expectations. Nightly and manual
  # runs only: this is a measurement channel, so regressions are reported
  # in the summary and artifacts and never fail the job or file issues.
  wpt:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: wpt raikiri / ${{ matrix.phase }}
    runs-on: ubuntu-latest
    # A crash that catch_unwind cannot stop (e.g. a stack overflow) still
    # ends the test binary; keep that a report, not a red workflow.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: css-page
            test: wpt_css_page
          - phase: multicol-1
            test: wpt_lists
            filter: wpt_list_multicol_1
          - phase: multicol-2
            test: wpt_lists
            filter: wpt_list_multicol_2
          - phase: multicol-3
            test: wpt_lists
            filter: wpt_list_multicol_3
          - phase: bugs
            test: wpt_lists
            filter: wpt_list_bugs
          - phase: smoke
            test: wpt_lists
            filter: wpt_list_smoke
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur-raikiri-wpt-${{ matrix.phase }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - name: Configure mold linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Fetch WPT subset
        run: scripts/wpt/fetch.sh
      - name: Run ${{ matrix.phase }} reftests (raikiri)
        env:
          FULGUR_REVISION: ${{ github.sha }}
          FULGUR_WPT_ENGINE: raikiri
          # Missing prerequisites are a real bug in the WPT job.
          FULGUR_WPT_REQUIRED: "1"
        run: cargo test -p fulgur-wpt --features raikiri --test ${{ matrix.test }} -- ${{ matrix.filter }} --nocapture
      - name: Append step summary
        if: always()
        run: |
          summary="target/wpt-report/raikiri/${{ matrix.phase }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no summary for ${{ matrix.phase }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpt-raikiri-${{ matrix.phase }}
          path: target/wpt-report/raikiri/${{ matrix.phase }}
          if-no-files-found: warn
      - name: Evict WPT checkout from the build-artifact cache
        # Same reason as the wpt job in ci.yml: a git checkout under target/
        # must not round-trip through the rust-cache tarball.
        if: always()
        run: rm -rf target/wpt

  # fulgur-vrt fixtures rendered through the Raikiri backend and compared,
  # page by page, against the committed Blitz goldens (which ci.yml keeps
  # byte-equal to the Blitz output). Nightly and manual runs only: this is a
  # measurement channel, so differences are reported in the step summary and
  # artifacts and never fail the job.
  vrt:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: vrt raikiri vs blitz
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur-raikiri-vrt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - name: Configure mold linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Compare fixtures with the Blitz goldens
        # Same pinned font set as the VRT job in ci.yml, so the Blitz
        # goldens are what Blitz renders on this host.
        run: FONTCONFIG_FILE="$PWD/examples/.fontconfig/fonts.conf" cargo test -p fulgur-vrt --features raikiri --test raikiri_compare -- --nocapture
      - name: Append step summary
        if: always()
        run: |
          summary="target/vrt-report/raikiri/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no VRT comparison summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-raikiri
          path: target/vrt-report/raikiri
          if-no-files-found: warn
