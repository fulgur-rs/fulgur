name: Release

# release-plz.yml publishes to crates.io and pushes the `vX.Y.Z` tag (with an
# App token, so this tag push fires other workflows). This workflow picks up
# from that tag: build platform binaries, attach them to the draft GH Release
# release-plz created, flip it to non-draft, and publish npm packages.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io publish + tag creation live in release-plz.yml's `release` job,
  # which only runs after the Release PR merges — and that merge is gated by the
  # `release-pr-approval` required status check (the single release approval).
  # This workflow starts from the pushed `vX.Y.Z` tag, so all it needs up front
  # is the bare version (tag name minus the leading `v`) as a shared job output.
  # The direct-`v*`-tag-push bypass is closed at the source by the
  # `RestrictReleaseTag` tag-protection ruleset (creation restricted to the
  # release App), not by an approval gate in this workflow — see
  # docs/RELEASE_SETUP.md.
  setup:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Validate semver format
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version from tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            rustflags: "-C link-arg=-fuse-ld=mold"
            install-mold: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            rustflags: "-C link-arg=-fuse-ld=mold"
            install-mold: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: "-C linker=lld-link"
            install-mold: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: "v${{ needs.setup.outputs.version }}"
          # Read-only checkout (build binaries / publish npm from artifacts);
          # no push happens here, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          # SHA pin drops the `@stable` ref, so name the channel explicitly —
          # the action infers the toolchain from the ref name otherwise.
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ${{ matrix.target }}-release

      - name: Install mold
        if: matrix.install-mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Configure linker
        if: matrix.rustflags != ''
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> $GITHUB_ENV

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --bin fulgur -p fulgur-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.tar.gz fulgur
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/fulgur.exe" -DestinationPath "fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.zip"

      - name: Stage npm binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p npm-bin
          cp target/${{ matrix.target }}/release/fulgur npm-bin/fulgur

      - name: Stage npm binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force npm-bin
          Copy-Item "target/${{ matrix.target }}/release/fulgur.exe" "npm-bin/fulgur.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-${{ matrix.target }}
          path: npm-bin/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fulgur-${{ matrix.target }}
          path: fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.*

  release:
    name: Publish GitHub Release
    needs: [setup, build-binaries]
    runs-on: ubuntu-latest
    # No `environment:` approval gate here BY DESIGN. The single release approval
    # is the `release-pr-approval` required status check on the Release PR (see
    # docs/RELEASE_SETUP.md → "Approval model"). A tag reaches this job only after
    # that approval, because tag creation lives in release-plz.yml's (post-merge)
    # `release` job. The one path that skips that — a `v*` tag pushed DIRECTLY —
    # is blocked at the source by the `RestrictReleaseTag` tag ruleset, NOT by a
    # gate here (which, with the `release` env carrying no required reviewers, would be
    # inert anyway). Don't add `environment: release` here to "fix" a finding: it
    # would imply a gate that isn't there. Publishing this Release fires
    # `release:published`, which triggers release-python.yml / release-ruby.yml.
    steps:
      # Publish step reads CHANGELOG.md via awk (SSoT mirror, fulgur-kf6a) so we
      # need the file on disk. `ref: v${{ needs.setup.outputs.version }}` pins
      # the checkout to the tag that fired this workflow (release-plz just
      # created it), so we read the exact CHANGELOG that shipped in the
      # release commit. Sparse-checkout keeps the tree minimal.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: "v${{ needs.setup.outputs.version }}"
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: 'fulgur-*'
          merge-multiple: true

      # GITHUB_TOKEN で発火した release:published は別 workflow を起動しない
      # (無限ループ防止仕様)。release-python.yml / release-ruby.yml を連鎖発火
      # させるため、App token で publish する。
      # 手順は docs/RELEASE_SETUP.md を参照。
      - name: Generate App token for release publish
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Upload binaries and publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          REPO="${{ github.repository }}"
          # Create release if draft doesn't exist (fallback)
          if ! gh release view "v$VERSION" --repo "$REPO" &>/dev/null; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Release v$VERSION" \
              --draft \
              --repo "$REPO"
          fi
          # Upload binaries and publish (App token → release:published が連鎖発火)
          # --clobber: workflow re-run 時 (build 失敗リトライ等) に同名 asset を上書き
          gh release upload "v$VERSION" artifacts/* --clobber --repo "$REPO"
          # Set the Release body from the committed CHANGELOG.md so the GH
          # Release, docs site, and repo history stay in lockstep (SSoT
          # mirror — fulgur-kf6a). release-plz created the draft with a
          # commit-based body (changelog_update is off, so it's empty/
          # minimal); overwrite it here. This is a release edit — no commit/
          # push to main — so it does not retrigger release-plz. See
          # fulgur-b0nb.
          #
          # Extract the `## [VERSION]` section body (heading excluded),
          # stopping at the next `## [` heading or EOF. `gh api generate-
          # notes` remains as a fallback only if the section is empty or
          # missing (e.g. a hotfix release where CHANGELOG hasn't been
          # touched); the fallback preserves the pre-SSoT behaviour so a
          # legacy edge case can't ship an empty Release body.
          # Drop the release-notes:auto marker HTML comments from the extracted
          # body: they are aux-sync machinery, not release content, and would
          # otherwise leak into `gh release view --json body` and the Edit-
          # release pane (GitHub's Markdown renderer hides them, but the raw
          # body carries them). Stripping also makes the emptiness guard below
          # correctly recognise an auto-block with no PRs and no hand-adds as
          # empty and fall back to generate-notes.
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { in_sec = 0 }
            /^## \[/ {
              if (in_sec) exit
              if (match($0, /^## \[[^\]]+\]/)) {
                hdr = substr($0, RSTART, RLENGTH)
                if (hdr == "## [" ver "]") { in_sec = 1; next }
              }
            }
            in_sec { print }
          ' CHANGELOG.md | grep -v '^<!-- release-notes:auto:' || true)
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; falling back to generate-notes"
            NOTES=$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="v$VERSION" --jq .body)
          fi
          gh release edit "v$VERSION" --notes "$NOTES" --draft=false --repo "$REPO"

  publish-npm:
    name: Publish npm packages
    # Depend on `release` too so npm publishes only after the GitHub Release is
    # published — a failed gh release upload/edit must not leave npm shipped
    # while the release is missing its binaries.
    needs: [setup, build-binaries, release]
    # npm publishes unconditionally, in lockstep with the crates.io release —
    # bindings are never partially skipped, so there is no per-release label gate
    # to evaluate here. See fulgur-f7o2 for the removal of the old label support.
    runs-on: ubuntu-latest
    # `environment: release` here is NOT an approval gate (the `release`
    # environment has no required reviewers — approval is the Release PR gate,
    # see docs/RELEASE_SETUP.md). It is NOT a no-op either: referencing an
    # environment sets this job's OIDC subject to `…:environment:release`, and npm
    # Trusted Publishing can be configured to require that environment (the
    # optional "Environment name" field on npmjs.com). Keep it in sync with the
    # npm trusted-publisher registration. npm is safe from rogue tags because this
    # job runs off the `vX.Y.Z` tag, which only exists after the approved Release
    # PR merge (+ the `RestrictReleaseTag` ruleset).
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: "v${{ needs.setup.outputs.version }}"
          # Read-only checkout (build binaries / publish npm from artifacts);
          # no push happens here, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all npm artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: false

      - name: Publish platform packages
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -e
          declare -A TARGET_TO_DIR=(
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["x86_64-unknown-linux-musl"]="linux-x64-musl"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["aarch64-apple-darwin"]="darwin-arm64"
            ["x86_64-apple-darwin"]="darwin-x64"
            ["x86_64-pc-windows-msvc"]="win32-x64"
          )

          for target in "${!TARGET_TO_DIR[@]}"; do
            dir="${TARGET_TO_DIR[$target]}"
            pkg_dir="packages/npm/$dir"
            artifact_dir="npm-artifacts/npm-$target"

            if [ -f "$artifact_dir/fulgur.exe" ]; then
              cp "$artifact_dir/fulgur.exe" "$pkg_dir/bin/fulgur.exe"
            else
              cp "$artifact_dir/fulgur" "$pkg_dir/bin/fulgur"
              chmod +x "$pkg_dir/bin/fulgur"
            fi

            cd "$pkg_dir"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            PKG_NAME=$(node -p "require('./package.json').name")
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Already published ${PKG_NAME}@${VERSION}, skipping."
            else
              npm publish --access public --provenance
            fi
            cd - > /dev/null
          done

      - name: Publish meta package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd packages/npm/meta
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            for (const k of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "Already published ${PKG_NAME}@${VERSION}, skipping."
          else
            npm publish --access public --provenance
          fi
