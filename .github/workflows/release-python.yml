name: Release (Python / PyPI)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2014"
            rustflags: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: "2014"
            rustflags: ""
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            manylinux: musllinux_1_2
            rustflags: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            manylinux: musllinux_1_2
            rustflags: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            rustflags: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            rustflags: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            rustflags: "-C linker=lld-link"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-python-release
      - name: Configure linker
        if: matrix.rustflags != ''
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> $GITHUB_ENV
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --strip --out dist -m crates/pyfulgur/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist -m crates/pyfulgur/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke-test-sdist:
    # sdist は wheel 非対応プラットフォームの fallback。requires-python = ">=3.9"
    # の下端 (3.9) と最新 (3.13) で source build を検証する。
    name: Smoke test (sdist / Python ${{ matrix.python-version }})
    needs: [build-sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
      - name: Install sdist (source build)
        shell: bash
        run: |
          shopt -s failglob
          python -m pip install dist/*.tar.gz
      - name: Smoke test
        shell: bash
        run: |
          python -c "
          import pyfulgur
          engine = pyfulgur.Engine()
          pdf = engine.render_html('<p>hi</p>')
          assert isinstance(pdf, (bytes, bytearray)), type(pdf)
          assert len(pdf) > 100, len(pdf)
          print(f'OK: {len(pdf)} bytes')
          "

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: [build-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            artifact: wheels-aarch64-unknown-linux-gnu
          - os: macos-15-intel
            artifact: wheels-x86_64-apple-darwin
          - os: macos-latest
            artifact: wheels-aarch64-apple-darwin
          - os: windows-latest
            artifact: wheels-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install wheel (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shopt -s failglob
          pip install dist/*.whl
      - name: Install wheel (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found in dist/" }
          pip install $wheel.FullName
      - name: Smoke test
        shell: bash
        run: |
          python -c "
          import pyfulgur
          engine = pyfulgur.Engine()
          pdf = engine.render_html('<p>hi</p>')
          assert isinstance(pdf, (bytes, bytearray)), type(pdf)
          assert len(pdf) > 100, len(pdf)
          print(f'OK: {len(pdf)} bytes')
          "

  smoke-test-musl:
    # Verify musllinux wheels on an actual Alpine (musl) environment.
    # Alpine runs via `docker run` rather than `container:` because JavaScript
    # actions (download-artifact) inside Alpine containers are only supported
    # on x64 runners — the arm64 runner fails with "JavaScript Actions in
    # Alpine containers are only supported on x64 Linux runners". Alpine's
    # Python is PEP 668 externally-managed, so the wheel installs into a venv.
    name: Smoke test (Alpine / ${{ matrix.target }})
    needs: [build-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - name: Smoke test in Alpine container
        run: |
          docker run --rm -v "$PWD/dist:/dist" alpine:3.24 sh -ec '
          apk add --no-cache python3 py3-pip
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install /dist/*.whl
          /tmp/venv/bin/python -c "
          import pyfulgur
          engine = pyfulgur.Engine()
          pdf = engine.render_html(\"<p>hi</p>\")
          assert isinstance(pdf, (bytes, bytearray)), type(pdf)
          assert len(pdf) > 100, len(pdf)
          print(f\"OK: {len(pdf)} bytes\")
          "'

  verify-release-tag:
    name: Verify release tag
    # PyPI publish must only run for a real `vX.Y.Z` release tag. `release` events
    # fire for a Release published on ANY tag name, and `github.event_name ==
    # 'release'` alone does not prove the tag is a semver `v*` tag or that the
    # release came from the gated release-plz path. The RestrictReleaseTag ruleset
    # restricts creation of `v[0-9]*.[0-9]*.[0-9]*` tags to the release App, so
    # requiring a semver tag here ties this publish to the same gated namespace as
    # crates.io / npm (release.yml's `setup` job does the equivalent check). A
    # Release published on a non-semver tag — which the ruleset does NOT cover — is
    # rejected before publish. See docs/RELEASE_SETUP.md.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-semver release tag
        # $GITHUB_REF_NAME is a runner-set env var, not a ${{ }} template, so the
        # attacker-influenced tag name cannot inject shell. Keep it quoted.
        # Validate the FULL tag INCLUDING the leading `v`. A bare `1.2.3` tag is
        # NOT covered by the RestrictReleaseTag ruleset (`v[0-9]*.[0-9]*.[0-9]*`),
        # so it must not pass here either — do not strip `v` first. (release.yml's
        # `setup` can strip `v` because its `push: tags: v*` trigger already
        # guarantees the prefix; `release:published` is tag-name-agnostic.)
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Refusing to publish: release tag '$GITHUB_REF_NAME' is not a vX.Y.Z release tag"
            exit 1
          fi
          echo "Release tag OK: $GITHUB_REF_NAME"

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, smoke-test, smoke-test-sdist, smoke-test-musl, verify-release-tag]
    # 本番 PyPI publish は release イベント (release.yml がタグから発火) のみ。
    # workflow_dispatch からは任意の ref を publish できないようにする (security)。
    # 手動検証は publish-testpypi (dry_run=true) を使う。加えて verify-release-tag が
    # semver `v*` タグを要求し、非 semver タグの Release からの publish を塞ぐ。
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build-wheels, build-sdist, smoke-test, smoke-test-sdist, smoke-test-musl]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
