name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Default least-privilege token scope. Jobs that need more (e.g. test's
# id-token: write for Codecov OIDC, octocov's pull-requests: write) override
# this with their own `permissions:` block — job-level permissions fully
# replace the workflow-level set, they do not merge.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

  scripts-release-tests:
    name: Release scripts (pytest)
    runs-on: ubuntu-latest
    # Path-filter would trim this to `scripts/release/**` PRs only, but the
    # job is <1min and always-run avoids `paths:` drift + the `paths-filter`
    # action's own maintenance cost. Cheap protection for release automation.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python3 -m pytest scripts/release/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            coverage: false
            mold: true
            cache-key: ubuntu-latest-fulgur
          - os: ubuntu-latest
            arch: amd64
            coverage: true
            mold: true
            cache-key: ubuntu-latest-fulgur-cov
          - os: ubuntu-24.04-arm
            arch: arm64
            coverage: false
            mold: true
            cache-key: ubuntu-24.04-arm-fulgur
          - os: macos-latest
            arch: arm64
            coverage: false
            mold: false
            cache-key: macos-latest-fulgur
          - os: windows-latest
            arch: amd64
            coverage: false
            mold: false
            cache-key: windows-latest-fulgur
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # `tool-cache` + `large-packages` removal is slow (~1-2 min each), so pay
          # it only on the coverage cell — it runs `cargo llvm-cov nextest` twice
          # (instrumented build + profraw) and was flaking on "No space left on
          # device". Other Linux cells keep them off (no time cost). The coverage
          # job uses none of the hostedtoolcache (Rust via rustup, cargo-llvm-cov /
          # nextest via taiki-e into ~/.cargo/bin), so removing tool-cache is safe.
          tool-cache: ${{ matrix.coverage }}
          android: true
          dotnet: true
          haskell: true
          large-packages: ${{ matrix.coverage }}
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install poppler-utils (for fulgur-wpt pdftocairo tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - name: Configure mold linker
        if: matrix.mold
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Configure lld-link linker (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C linker=lld-link" >> $GITHUB_ENV
      - name: Install cargo-llvm-cov
        if: matrix.coverage
        uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51 # nextest
      # NOTE: fulgur-wpt integration tests (wpt_css_page, wpt_lists)
      # silently skip here because target/wpt is not fetched in the coverage
      # cell — fetching + running all phases would add ~4-5 min to PR CI.
      # That leaves `crates/fulgur-wpt/src/runner.rs` under-reported in
      # Codecov. The WPT coverage surface is exercised by the `wpt` matrix
      # job (in this same workflow) and by nightly; Codecov numbers here
      # only reflect unit-test coverage.
      - name: Build tests
        if: ${{ !matrix.coverage }}
        run: cargo nextest run --workspace --exclude fulgur-vrt --no-run
      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: cargo nextest run --workspace --exclude fulgur-vrt
      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --exclude fulgur-vrt --profile ci --no-report
          cargo llvm-cov nextest --workspace --exclude fulgur-vrt --features fulgur/parallel --profile ci --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ matrix.coverage && !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          files: target/nextest/ci/junit.xml
          use_oidc: true
          fail_ci_if_error: false

  wasm-check:
    name: WASM build check
    runs-on: ubuntu-latest
    # Strategic gate: keeps the `fulgur` library buildable on
    # `wasm32-unknown-unknown` so the future `fulgur-wasm` wrapper crate
    # (browser HTML→PDF, AI agent sandboxes) stays one step away.
    # Failure means a dependency or new code added a non-WASM-compatible
    # surface (filesystem, native-only API, missing target cfg) — fix or
    # cfg-gate it before merging. Tracking: fulgur-iym, fulgur-g5bn.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Do NOT set RUSTFLAGS=-C link-arg=-fuse-ld=mold here; env RUSTFLAGS
      # is target-agnostic and would force mold onto the wasm32 build.
      - run: cargo check --target wasm32-unknown-unknown -p fulgur -p fulgur-wasm

  vrt:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure mold linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Run VRT
        run: FONTCONFIG_FILE="$PWD/examples/.fontconfig/fonts.conf" cargo test -p fulgur-vrt
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vrt-diffs
          path: target/vrt-diff/
          retention-days: 14
          if-no-files-found: ignore

  octocov:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: lcov
      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1

  wpt:
    name: wpt / ${{ matrix.phase }}
    runs-on: ubuntu-latest
    # WPT reftests are a reporting channel, not a blocker on PRs.
    # Regressions surface via the step summary and target/wpt-report artifacts.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: css-page
            test: wpt_css_page
          - phase: css-break
            test: wpt_css_break
          - phase: multicol-1
            test: wpt_lists
            filter: wpt_list_multicol_1
          - phase: multicol-2
            test: wpt_lists
            filter: wpt_list_multicol_2
          - phase: multicol-3
            test: wpt_lists
            filter: wpt_list_multicol_3
          - phase: bugs
            test: wpt_lists
            filter: wpt_list_bugs
          - phase: opacity-visibility
            test: wpt_lists
            filter: wpt_list_opacity_visibility
          - phase: smoke
            test: wpt_lists
            filter: wpt_list_smoke
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils mold
      - name: Configure mold linker
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV
      - name: Fetch WPT subset
        run: scripts/wpt/fetch.sh
      - name: Run ${{ matrix.phase }} reftests
        env:
          FULGUR_REVISION: ${{ github.sha }}
          # Tells the integration test to panic (rather than silently skip)
          # if run_phase returns None — this job IS the WPT job, so missing
          # prerequisites are a real bug here.
          FULGUR_WPT_REQUIRED: "1"
        run: cargo test -p fulgur-wpt --test ${{ matrix.test }} -- ${{ matrix.filter }} --nocapture
      - name: Append step summary
        if: always()
        run: |
          summary="target/wpt-report/${{ matrix.phase }}/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no summary for ${{ matrix.phase }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpt-${{ matrix.phase }}-report
          path: target/wpt-report/${{ matrix.phase }}
          if-no-files-found: warn

  bindings-check:
    name: Bindings type-check
    # `crates/pyfulgur` (extension-module) と `crates/fulgur-ruby` (ruby-api) は
    # `#![cfg(feature = "...")]` で全体 gate されており、workspace 標準の
    # `cargo check --workspace` / clippy では空コンパイルされるため型エラーが
    # 検出されない。0.6.0 release で `fulgur::Error::Other` の match arm 不足が
    # release-* job まで気付かれなかった問題 (PR #217) の再発防止。
    # 型エラー検出が目的のため Linux 単一・matrix 無し。クロス OS build/link
    # 検証は release-python.yml / release-ruby.yml の責務。
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771  # v1.4.4
        with:
          ruby-version: "3.3"
          rustup-toolchain: stable
          bundler-cache: false
          cargo-cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur-bindings
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy pyfulgur (extension-module)
        run: cargo clippy -p pyfulgur --features extension-module --all-targets -- -D warnings
      - name: cargo clippy fulgur-ruby (ruby-api)
        run: cargo clippy -p fulgur-ruby --features ruby-api --all-targets -- -D warnings
