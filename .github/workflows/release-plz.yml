name: Release-plz

# Least privilege: keep the top-level default read-only and grant write only to
# the jobs that need it (release-pr creates/updates the Release PR; release has
# its own permissions block below).
permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Manual escape hatch if a real release wasn't detected from the push (e.g. the
  # Release PR was squash-merged with a hand-edited subject). A workflow_dispatch
  # run still pauses on the `crates-io` environment approval before publishing.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The `release` job below runs on EVERY push to main but only actually
  # publishes when a Release PR was just merged. Its `crates-io` environment
  # carries required reviewers (the release-execution approval, ②), and an
  # environment gate pauses a job the moment it becomes eligible to run — so
  # without a guard, every ordinary merge to main would sit waiting for a release
  # approval. This job detects whether the push is a real release; the `release`
  # job is `if:`-gated on the result, so the approval prompt appears on real
  # releases alone.
  check-releases:
    name: Detect a real release
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.check.outputs.has_releases }}
    steps:
      - name: Determine whether this push is an actual release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          COMMIT_MSGS: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          set -euo pipefail
          emit() { echo "has_releases=$1" >> "$GITHUB_OUTPUT"; echo "has_releases=$1 ($2)"; }

          # Real releases live on main only. This check MUST precede the
          # workflow_dispatch hatch: a manual run can be dispatched from any
          # branch/tag, and publishing from a non-main ref would bypass the
          # Release PR (① content) gate and the main-branch ruleset.
          if [ "$REF" != "refs/heads/main" ]; then emit false "not main"; exit 0; fi

          # Manual escape hatch (main only) — still gated by the crates-io env approval.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then emit true "workflow_dispatch"; exit 0; fi

          # Merge-commit path: the Release PR head branch is `release-plz-<date>`,
          # which appears in the default "Merge pull request …" commit subject.
          HEAD_SUBJECT="${HEAD_MSG%%$'\n'*}"
          if printf '%s\n' "$HEAD_SUBJECT" | grep -qE 'release-plz-[0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            emit true "release-plz merge commit"; exit 0
          fi

          # Merge-method-agnostic path: release-plz always creates a
          # `chore: release vX.Y.Z` commit for a real release. It is in the push
          # whether the Release PR was merge-committed (as an inner commit) or
          # squash-merged (as the squash commit itself), so scan EVERY pushed
          # commit subject — detection then doesn't depend on the merge method.
          # Require the `vX.Y.Z` version so an ordinary subject like
          # `chore: release docs` doesn't false-positive and pause an unrelated
          # merge on the release approval.
          if printf '%s' "$COMMIT_MSGS" | jq -r '.[]? | split("\n")[0]' \
               | grep -qE '^chore: release v[0-9]'; then
            emit true "chore: release commit in push"; exit 0
          fi

          emit false "no release markers"

  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the Release PR branch + aux-file-sync commit
      pull-requests: write    # create/update the Release PR
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Create the Release PR (and push the aux-file-sync commit) as the release
      # App, NOT the default GITHUB_TOKEN. A PR/commit authored via GITHUB_TOKEN
      # does not fire other workflows, so ci.yml would never run on the Release
      # PR and every release would need CI kicked off by hand. Requires the App
      # to have Pull requests + Contents: Read and write.
      - name: Generate App token for the Release PR
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope to what release-pr needs: create/update the Release PR
          # (pull-requests) and create/advance the PR branch via the API
          # (contents). Include workflows too: the release branch can be
          # advanced across a commit that touched .github/workflows/* (e.g. this
          # very change once it lands on main), and GitHub rejects App ref
          # updates spanning workflow-file changes without it. The App grants it.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # Don't persist a token in git config where later actions could read
          # it. release-plz pushes the PR branch via the GitHub API (auth'd by
          # the App token in its env, below); the aux-file-sync step sets the
          # App token on its remote URL immediately before its own git push,
          # which also keeps that push App-authored so it triggers CI.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: false

      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f  # v0.5.133
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        if: fromJSON(steps.release-plz.outputs.pr).number
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # Explicit node pin (same SHA as release.yml) so the aux-file-sync step's
      # `node -e` calls don't depend on the ambient runner image version.
      # Without this, a runner image change that drops node would fail the
      # Release PR generation, not just the safety-net publish path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: fromJSON(steps.release-plz.outputs.pr).number
        with:
          node-version: '24'

      - name: Sync auxiliary version files onto the release PR branch
        if: fromJSON(steps.release-plz.outputs.pr).number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          PR_NUMBER=${{ fromJSON(steps.release-plz.outputs.pr).number }}
          gh pr checkout "$PR_NUMBER"

          # Export so child processes see it — the `node -e` calls below read
          # it via `process.env.VERSION`. A plain `VERSION=…` assignment stays
          # a shell variable and doesn't cross the process boundary, which
          # would silently produce a broken manifest (JSON.stringify strips
          # the undefined fields) that the verify pass then accepts (undefined
          # !== undefined). Everything else in this step reads VERSION through
          # bash interpolation, which is unaffected either way.
          export VERSION=$(grep '^version = ' crates/fulgur/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::Failed to extract a valid version from crates/fulgur/Cargo.toml"
            exit 1
          }

          # Mirrors the sed steps release-prepare.yml used to run — release-plz
          # only updates Cargo.toml/Cargo.lock/CHANGELOG.md, it has no hook to
          # touch these non-Cargo manifests (confirmed in fulgur-7b3l notes).
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/pyfulgur/pyproject.toml
          grep -Eq "^version = \"$VERSION\"$" crates/pyfulgur/pyproject.toml || {
            echo "::error::Failed to sync version in crates/pyfulgur/pyproject.toml"
            exit 1
          }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/fulgur-ruby/ext/fulgur/Cargo.toml
          grep -Eq "^version = \"$VERSION\"$" crates/fulgur-ruby/ext/fulgur/Cargo.toml || {
            echo "::error::Failed to sync version in crates/fulgur-ruby/ext/fulgur/Cargo.toml"
            exit 1
          }
          sed -i "s/^fulgur = \"[^\"]*\"$/fulgur = \"$VERSION\"/" crates/fulgur-ruby/ext/fulgur/Cargo.toml
          grep -Eq "^fulgur = \"$VERSION\"$" crates/fulgur-ruby/ext/fulgur/Cargo.toml || {
            echo "::error::Failed to sync fulgur dependency version in crates/fulgur-ruby/ext/fulgur/Cargo.toml"
            exit 1
          }
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" crates/fulgur-ruby/lib/fulgur/version.rb
          grep -Eq "^[[:space:]]*VERSION = \"$VERSION\"$" crates/fulgur-ruby/lib/fulgur/version.rb || {
            echo "::error::Failed to sync version in crates/fulgur-ruby/lib/fulgur/version.rb"
            exit 1
          }

          # packages/npm/meta/package.json holds the meta package's own version
          # plus one optionalDependencies entry per platform sub-package — all
          # published in lockstep with the workspace crates. release.yml's
          # `Publish meta package` step already overwrites these at publish time
          # (so publish is correct regardless of repo state), but if the repo
          # values stay stale, Dependabot chases them with churn PRs (fulgur-yzky).
          # Sync here so the Release PR carries the correct values and the repo
          # state matches what npm sees.
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const path = 'packages/npm/meta/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = version;
            for (const k of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[k] = version;
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          " || {
            echo "::error::Failed to rewrite packages/npm/meta/package.json"
            exit 1
          }
          node -e "
            const pkg = require('./packages/npm/meta/package.json');
            const v = process.env.VERSION;
            if (pkg.version !== v) {
              console.error('meta package.json version', pkg.version, '!=', v);
              process.exit(1);
            }
            for (const [k, val] of Object.entries(pkg.optionalDependencies)) {
              if (val !== v) {
                console.error('meta package.json optionalDependencies[' + k + ']', val, '!=', v);
                process.exit(1);
              }
            }
          " || {
            echo "::error::Failed to verify packages/npm/meta/package.json"
            exit 1
          }

          # Don't expose the App token to Bundler: `bundle install` runs
          # arbitrary gem build/install hooks, so drop GH_TOKEN from its env.
          (cd crates/fulgur-ruby && env -u GH_TOKEN bundle install)

          # PR-based changelog: render notes from the PRs merged since the last
          # release (classified by release-notes:* labels per .github/release.yml)
          # and prepend a dated section to the root CHANGELOG.md. release-plz's own
          # per-crate changelog is disabled (changelog_update=false in
          # release-plz.toml), so this is the single changelog source. Doing it in
          # this release-pr job — not a post-publish push to main — keeps the
          # changelog inside the Release PR's tagged commit and avoids a main push
          # that would retrigger release-plz (release-pr has no if-gate). See
          # fulgur-b0nb.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" \
            --jq .body > RELEASE_NOTES.md
          DATE=$(date -u +%Y-%m-%d)
          # Drop the API's "## What's Changed" preamble so the label categories
          # nest cleanly under "## [VERSION] - DATE" as H3.
          sed -i "/^## What's Changed$/d" RELEASE_NOTES.md

          # Capture origin/main's committed CHANGELOG to a file so
          # rebuild_changelog.py can read it by path. A plain `git show > file`
          # is fine under `set -e`: if the ref can't be read, git exits
          # non-zero and the step aborts before the script consumes an empty
          # file. Reading origin/main (not the PR working copy) is what keeps
          # re-runs idempotent — release-pr has no if-gate and re-runs on
          # every push to main, and the `gh pr checkout` copy may already
          # carry this release's section from an earlier run.
          git show origin/main:CHANGELOG.md > /tmp/origin_CHANGELOG.md

          # Rebuild CHANGELOG.md preserving marker-outside hand-adds
          # (PREAMBLE / POSTAMBLE around the auto:begin/end markers). See
          # scripts/release/README.md for the marker convention. Missing
          # markers => full section treated as postamble + ::warning:: to
          # stderr; safe fallback, no data loss.
          python3 scripts/release/rebuild_changelog.py \
            --version "$VERSION" \
            --date "$DATE" \
            --auto-notes RELEASE_NOTES.md \
            --pr-changelog CHANGELOG.md \
            --origin-changelog /tmp/origin_CHANGELOG.md \
            > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md
          rm -f RELEASE_NOTES.md /tmp/origin_CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync aux version files + changelog for $VERSION" || echo "no changes to sync"
          # Put the App token on the remote only for the push, and scrub it
          # immediately after — via a trap so it's removed even if the push
          # fails — so it isn't left in .git/config for later actions' post-job
          # hooks (checkout did not persist credentials for the same reason).
          # The token makes the push App-authored, which triggers CI on the PR.
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" || true' EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push

  release:
    name: Release-plz release
    needs: [release-pr, check-releases]
    # Only run — and thus only hit the `crates-io` approval gate — on an actual
    # release. See check-releases above for why (this is what keeps ordinary
    # merges to main from pausing on a release approval).
    if: needs.check-releases.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    # Serialize publishing so a main push that lands while a release is still
    # in flight can't start a second `release-plz release` from a newer SHA and
    # race the first for the same version. Queued runs are harmless: release-plz
    # skips a version already published to crates.io.
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    # `environment: crates-io` does double duty:
    #   1. Release-execution approval gate (②): this environment carries required
    #      reviewers, so a maintainer must approve before crates.io publish + tag
    #      creation. Because tag creation cascades to release.yml (GitHub Release
    #      → npm / PyPI / RubyGems), approving here authorizes the WHOLE release.
    #      Reviewing the release *contents* (①) is the separate
    #      `release-pr-approval` status check on the Release PR — see
    #      docs/RELEASE_SETUP.md.
    #   2. Stamps the OIDC token with `environment:crates-io` so it matches the
    #      crates.io Trusted Publisher (register it with Environment = crates-io).
    # The `release` environment stays reviewer-less; it is used only for npm OIDC
    # in release.yml's publish-npm job.
    environment: crates-io
    permissions:
      contents: write
      id-token: write  # required by rust-lang/crates-io-auth-action (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: false

      # GITHUB_TOKEN's tag push / GH Release creation would not trigger the
      # build-binaries/release/publish-npm jobs in release.yml (GITHUB_TOKEN-
      # authored events don't fire other workflows). Use the same App token
      # release.yml already uses for this reason.
      #
      # This works because release-plz creates the `vX.Y.Z` tag via the GitHub
      # API (github_client.create_tag) using the token passed below as
      # GITHUB_TOKEN — the App token — so the tag-push event is App-authored and
      # fires release.yml. Checkout does not persist credentials, which is fine:
      # this job never `git push`es (release-plz uses the API).
      # CAUTION: release-plz only takes the API path when tags are unsigned. If
      # you ever enable tag signing (git config tag.gpgSign true) or add a
      # `git push` step here, release-plz falls back to the git CLI, which would
      # then need the App token configured on the remote immediately before the
      # push (else it uses the default token and SILENTLY breaks the cascade).
      - name: Generate App token for tag/release push
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope to what `release-plz release` needs: create the tag + GH
          # Release (contents) and read associated PRs for contributors
          # (pull-requests). Keep `workflows: write` too — a release tag can
          # point at a commit that touched .github/workflows/*, and the
          # documented release-bot setup requires it for that case
          # (docs/RELEASE_SETUP.md); the App already grants it, so requesting it
          # here removes the risk of the tag/release API rejecting the SHA.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Run release-plz release
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f  # v0.5.133
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
