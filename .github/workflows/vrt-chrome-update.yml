name: VRT Chrome Golden Update

# Manually-triggered workflow that regenerates the Chromium goldens under
# crates/fulgur-vrt/goldens/chrome/: each fixture printed to PDF by a pinned
# Chrome for Testing build. This is intentionally separate from the main
# `vrt` job so:
#   - the Chrome download and the `chrome-golden` feature's dependencies
#     (chromiumoxide, tokio, futures) never slow normal PRs
#   - golden updates are an explicit decision, not an accidental PR diff
#
# The Chrome version is pinned in `crates/fulgur-vrt/src/chrome.rs`
# (`CHROME_VERSION`); the generator refuses any other build. Bump that
# constant in the same change that commits the regenerated PDFs: download the
# `chrome-goldens` artifact and copy it over crates/fulgur-vrt/goldens/chrome/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-goldens:
    name: Regenerate Chromium goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned Chrome version
        id: pin
        run: |
          version=$(sed -n 's/^pub const CHROME_VERSION: &str = "\(.*\)";$/\1/p' crates/fulgur-vrt/src/chrome.rs)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          chrome-version: ${{ steps.pin.outputs.version }}
          install-dependencies: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate Chrome goldens
        env:
          # Same pinned font set as the VRT job, so text in the goldens uses
          # the bundled fonts rather than the runner's.
          FONTCONFIG_FILE: ${{ github.workspace }}/examples/.fontconfig/fonts.conf
          FULGUR_VRT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          rm -rf crates/fulgur-vrt/goldens/chrome
          cargo test -p fulgur-vrt --features chrome-golden --test chrome_golden -- --ignored --nocapture

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v7
        with:
          name: chrome-goldens
          path: crates/fulgur-vrt/goldens/chrome/
          retention-days: 30
          if-no-files-found: error
