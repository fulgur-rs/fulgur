[package]
name = "fulgur-core"
version = "0.41.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend-independent configuration, assets, and PDF utilities for fulgur"
readme = "README.md"
keywords = ["pdf", "html", "css", "converter"]
categories = ["text-processing"]

# Layout-engine crates (blitz-*, stylo, taffy, parley, raikiri-*) must not be
# added here: this crate is shared by every layout backend.
[dependencies]
krilla = "0.7.0"
woff2-patched = "0.4"
thiserror = "2"
minijinja = { version = "=2.24.0", features = ["unstable_machinery"] }
log = "0.4"
lopdf = "0.42.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }

# WASM (wasm32-unknown-unknown) build support: pulled in transitively by lopdf/rand.
# Feature unification propagates `wasm_js` to the lopdf-side dependency so the
# crate selects the `crypto.getRandomValues()` backend instead of failing with
# `compile_error!`. Browser-class targets only — WASI requires a different
# backend selection. Tracking: fulgur-iym (strategic v0.7.0).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1"
