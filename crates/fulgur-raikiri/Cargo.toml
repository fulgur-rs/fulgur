[package]
name = "fulgur-raikiri"
version = "0.41.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Raikiri layout backend under development for fulgur"
readme = "README.md"
keywords = ["pdf", "html", "css", "converter"]
categories = ["text-processing"]

[dependencies]
krilla = "0.7.0"
tiny-skia = "0.12"
skrifa = "0.47"
fulgur-core = { version = "0.41.0", path = "../fulgur-core" }
raikiri-html = "0.0.6"
raikiri-net = "0.0.6"
raikiri-traits = "0.0.6"
url = "2.5"
percent-encoding = "2"
flpdf = "0.10"
tempfile = "3"

[dev-dependencies]
lopdf = "0.45"
