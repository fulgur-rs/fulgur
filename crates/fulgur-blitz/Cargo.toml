[package]
name = "fulgur-blitz"
version = "0.41.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Blitz-based HTML/CSS layout and PDF rendering backend for fulgur"
readme = "README.md"
keywords = ["pdf", "html", "css", "converter"]
categories = ["text-processing"]

[features]
## Enable rayon-based thread parallelism in `Engine::render_batch`.
parallel = ["dep:rayon"]

[dependencies]
fulgur-core = { version = "0.41.0", path = "../fulgur-core" }
rayon = { version = "1", optional = true }
cssparser = "0.38"
krilla = "0.7.0"
krilla-svg = "0.7.0"
usvg = "0.45"
# Same version usvg 0.45 decodes image hrefs with; the SVG sanitizer in
# `svg.rs` must classify `data:` URLs exactly the way usvg does.
data-url = "0.3"
# Bounded SVGZ decompression in the SVG sanitizer (usvg's is unbounded).
flate2 = "1.1.9"
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015", features = ["floats"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "b4ad543def00146850352c3da5dbc027f9053015" }
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "a3997d55bacd1fb6cd12fe31db0be15b20f91528" }
parley = "0.13"
skrifa = "0.47"
stylo = "0.24.0"
# Stylo's own traits (`ToCss`, `ParsingMode`), for resolving colours Stylo
# does not compute for Servo (`column-rule-color`). Already built by stylo.
stylo_traits = "0.24.0"
thiserror = "2"
minijinja = { version = "=2.24.0", features = ["unstable_machinery"] }
serde_json = "1"
log = "0.4"
lopdf = "0.45"
unicode-segmentation = "1.13"
unicode-properties = "0.1"
# Force-enable `image`'s `png` feature so PNG decoding (used by blitz-dom for
# `<img>` tags and CSS background-image) works consistently across every fulgur
# build target. Without this, `blitz-dom-0.2.4`'s `image = { default-features =
# false }` makes PNG decoding depend on which other workspace member is built
# alongside fulgur, producing different page-count outputs in CLI vs WPT runner
# (fulgur-zsn8).
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "0.25", default-features = false, features = ["png"] }
