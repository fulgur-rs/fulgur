[package]
name = "fulgur"
version = "0.40.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTML/CSS to PDF conversion library"
readme = "../../README.md"
keywords = ["pdf", "html", "css", "converter"]
categories = ["text-processing", "command-line-utilities"]

[features]
## Enable rayon-based thread parallelism in `Engine::render_batch`.
parallel = ["fulgur-blitz/parallel"]

# The facade re-exports the Blitz backend and the backend-independent core.
# Keep it free of layout logic of its own.
[dependencies]
fulgur-blitz = { version = "0.40.0", path = "../fulgur-blitz" }

[dev-dependencies]
fulgur-core = { version = "0.40.0", path = "../fulgur-core" }
tempfile = "3.27.0"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1.1"
lopdf = "0.42.0"
krilla = "0.7.0"
parley = "0.11"
serde_json = "1"
