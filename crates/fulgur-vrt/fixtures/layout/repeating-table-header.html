<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VRT fixture: repeating table header</title>
<style>
  @page { margin: 0; }
  html, body { margin: 0; padding: 0; }
  table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
    font-family: sans-serif;
  }
  th { height: 36px; color: white; background: #174ea6; }
  td { height: 28px; padding: 0; border: 1px solid #5f6368; }
  tbody tr:nth-child(odd) td { background: #e8f0fe; }
  tbody tr:nth-child(even) td { background: white; }
</style>
</head>

<table>
