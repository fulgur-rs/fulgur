<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Pinned fontconfig used by the VRT, the example PDF regeneration and
  the Chromium golden generation, so rendering is byte-identical across
  local, CI, and contributor environments. Consume it via
  `FONTCONFIG_FILE=...` from any working directory: the font directory
  is resolved relative to this file.

  Only the bundled fonts are visible. The system configuration is not
  included, so neither the host's font directories nor its generic
  family preferences (which would otherwise win over the aliases
  below) can change the output.

  See examples/.fonts/README.md for the rationale and the bundled
  font list.
-->
<fontconfig>
  <!-- The bundled Noto Sans set is the only font source. The cache
       goes to the user's cache directory; fontconfig keys it by the
       font directory, so it does not mix with other configurations. -->
  <dir prefix="relative">../.fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Map generic families to the bundled Noto Sans fonts. JP is
       listed as a fallback after the Latin fonts so mixed Latin +
       Japanese documents resolve via a single alias chain. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans JP</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans JP</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans JP</family>
    </prefer>
  </alias>
  <!-- Additional generic families required by fontique's System::new
       initialisation. Map them to Noto Sans so fontconfig never returns
       an empty font-set for any generic family query. -->
  <alias>
    <family>cursive</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>fantasy</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>math</family>
    <prefer><family>Noto Sans</family></prefer>
  </alias>
</fontconfig>
